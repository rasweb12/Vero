name: vero
description: App premium para treino, medidas corporais e evolucao fisica.
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cryptography: ^2.7.0
  flutter_riverpod: 2.6.1
  flutter_secure_storage: ^11.1.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  go_router: ^17.0.0
  fl_chart: ^1.2.0
  image_picker: ^1.2.1
  in_app_purchase: ^3.3.1
  purchases_flutter: ^10.13.2
  url_launcher: ^6.3.2
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  local_auth: ^3.0.2
  rive: ^0.14.11
  lottie: ^3.6.1
  video_player: ^2.11.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/exercises/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
